---
layout: dreamdulce.njk
title: index
nesting: "./"
page_nesting: "./pages/"
---

<aside class="sub">
  <div class="sub-content">
    
	</div>
</aside>
<main>
	<h2>Latest Review</h2>
	<div class="blog-posts-container">
	<ul>
	{% assign latest_post = review_entries[0] %}
	{% if latest_post %}
		<li>
			<a href="/reviews/{{ latest_post.url }}">
			{{ latest_post.date }}: {{ latest_post.name }}
			</a>
		</li>
		{% else %}
		<li>No blog posts yet!</li>
	{% endif %}
	</ul>
</div>
</main>
